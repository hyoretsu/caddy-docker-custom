name: Publish Docker image

on:
  schedule:
    - cron: "20 4 * * *"
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - Dockerfile
      - .github/workflows/**

permissions:
  contents: read
  packages: write

jobs:
  check-updates:
    name: Check for base image updates
    runs-on: ubuntu-latest
    outputs:
      needs-updating: >-
        ${{ steps.check.outcome == 'failure' && 'true' || steps.check.outputs.needs-updating }}
    steps:
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Check if Caddy base image updated
        id: check
        continue-on-error: true
        uses: lucacome/docker-image-update-checker@v3
        with:
          base-image: caddy:latest
          image: ghcr.io/${{ github.repository }}:latest
          platforms: linux/amd64,linux/arm64

  build-and-push:
    name: Build and Push
    needs: check-updates
    if: github.event_name != 'schedule' || needs.check-updates.outputs.needs-updating == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest
            type=sha,format=short

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
